name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build LanChat.exe
        run: |
          python -m pip install pyinstaller==5.13.2
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LanChat `
            --icon packaging\lanchat.ico `
            --add-data "lanchat\icon.png;lanchat" --add-data "lanchat\icon.ico;lanchat" `
            --paths . packaging\run_lanchat.py
      - uses: actions/upload-artifact@v4
        with:
          name: LanChat-windows
          path: dist/LanChat.exe
