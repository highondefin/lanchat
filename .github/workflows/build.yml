name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build LanChat.exe
        run: |
          python -m pip install pyinstaller==5.13.2
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LanChat `
            --icon packaging\lanchat.ico `
            --add-data "lanchat\icon.png;lanchat" --add-data "lanchat\icon.ico;lanchat" `
            --paths . packaging\run_lanchat.py
      - uses: actions/upload-artifact@v4
        with:
          name: LanChat-windows
          path: dist/LanChat.exe

      # Pushing a tag like v1.0.0 publishes a GitHub Release with the exe attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LanChat ${{ github.ref_name }}
          files: dist/LanChat.exe
          generate_release_notes: true
          body: |
            **Download `LanChat.exe` below** - a single file, no installation needed (Windows 10/11).

            - Quit IP Messenger on the same PC first (LanChat needs port 2425 to see IPMsg users).
            - Allow LanChat in Windows Firewall (Private networks): UDP/TCP 50505 and 2425.
            - Windows SmartScreen may warn because the exe isn't signed: More info -> Run anyway.
